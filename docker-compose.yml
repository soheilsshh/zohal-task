services:
  redis:
    image: redis:7.4-alpine
    # No snapshot and no AOF. A restart drops the bucket and the
    # idempotency keys. The API reaches this process as the hostname
    # redis, which is not 127.0.0.1 inside the API container.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
  postgres:
    image: postgres:16-alpine
    # The API reaches this process as the hostname postgres.
    # The password matches the default DATABASE_URL in app/settings.py.
    environment:
      POSTGRES_USER: zohal
      POSTGRES_PASSWORD: zohal
      POSTGRES_DB: zohal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zohal -d zohal"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      # Docker Desktop on Windows often does not deliver file events from a
      # bind mount. Polling is what makes --reload see a save.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/srv/app/app
      - ./alembic:/srv/app/alembic:ro
      - ./alembic.ini:/srv/app/alembic.ini:ro
      # Mounted file, not compose env_file. A reloader starts a new
      # process, which re-reads this file. Variables injected by Compose
      # would stay stale across that reload and hide the edit.
      - ./.env:/srv/app/.env:ro
    # Migrate, then serve. A second start runs the same upgrade and
    # changes nothing once the table exists. Reload does not migrate again.
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /srv/app --reload-include .env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
