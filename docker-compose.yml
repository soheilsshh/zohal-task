services:
  redis:
    image: redis:7.4-alpine
    # No snapshot and no AOF. A restart drops the bucket and the
    # idempotency keys. The API reaches this process as the hostname
    # redis, which is not 127.0.0.1 inside the API container.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Docker Desktop on Windows often does not deliver file events from a
      # bind mount. Polling is what makes --reload see a save.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/srv/app/app
      # Mounted file, not compose env_file. A reloader starts a new
      # process, which re-reads this file. Variables injected by Compose
      # would stay stale across that reload and hide the edit.
      - ./.env:/srv/app/.env:ro
    # Dev command. The image CMD serves without a reloader.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /srv/app
      # Default watching is *.py. The env file has to be named or a
      # save there never restarts the process.
      - --reload-include
      - .env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
