services:
  redis:
    image: redis:7.4-alpine
    # No snapshot and no AOF. A restart drops the bucket and the
    # idempotency keys. The API reaches this process as the hostname
    # redis, which is not 127.0.0.1 inside the API container.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
  postgres:
    image: postgres:16-alpine
    # The API reaches this process as the hostname postgres.
    # The password matches the default DATABASE_URL in app/settings.py.
    environment:
      POSTGRES_USER: zohal
      POSTGRES_PASSWORD: zohal
      POSTGRES_DB: zohal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zohal -d zohal"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  rabbitmq:
    image: rabbitmq:4-management-alpine
    # zohal, not guest. Guest is refused from another container.
    # The management UI is http://127.0.0.1:15672
    environment:
      RABBITMQ_DEFAULT_USER: zohal
      RABBITMQ_DEFAULT_PASS: zohal
    ports:
      - "15672:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-celery.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
  mongo:
    image: mongo:7
    # No auth and no published port. The worker reaches this process as
    # the hostname mongo. The API does not open a connection.
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: zohal-gateway
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Docker Desktop on Windows often does not deliver file events from a
      # bind mount. Polling is what makes --reload see a save.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/srv/app/app
      - ./alembic:/srv/app/alembic:ro
      - ./alembic.ini:/srv/app/alembic.ini:ro
      # Mounted file, not compose env_file. A reloader starts a new
      # process, which re-reads this file. Variables injected by Compose
      # would stay stale across that reload and hide the edit.
      - ./.env:/srv/app/.env:ro
    # Migrate, then serve. A second start runs the same upgrade and
    # changes nothing once the table exists. Reload does not migrate again.
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /srv/app --reload-include .env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
  worker:
    image: zohal-gateway
    # Same image as the API. This process is the only place the audit insert runs.
    # Do not start it from PowerShell. Celery on Windows is not this project's worker.
    command:
      - celery
      - -A
      - app.celery_app:celery
      - worker
      - --loglevel=info
      - --concurrency=1
    volumes:
      - ./app:/srv/app/app
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app:celery", "inspect", "ping", "-t", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
  locust:
    image: locustio/locust:2.32.4
    profiles: ["bench"]
    volumes:
      - ./bench/locustfile.py:/mnt/locust/locustfile.py:ro

volumes:
  pgdata:
  mongodata:
